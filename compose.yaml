services:
  mysql:
    image: mysql:9.7.2
    environment:
      MYSQL_DATABASE: lagermanager
      MYSQL_USER: lagermanager
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in your private .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your private .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - application
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" "$${MYSQL_DATABASE}" --connect-timeout=3 -Nse "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  backend:
    build:
      context: .
    image: lagermanager-backend:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lagermanager?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: lagermanager
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in your private .env}
      LAGERMANAGER_JWT_SECRET: ${LAGERMANAGER_JWT_SECRET:?Set LAGERMANAGER_JWT_SECRET in your private .env}
      # Deliberate local first-start policy: create/update tables, never create-drop.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      LAGERMANAGER_LOCAL_DEMO_POPULATE: "false"
      LAGERMANAGER_DEMO_RESET_PASSWORDS: "false"
    networks:
      - application
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'test "$$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 3 http://127.0.0.1:8080/api/products)" = 401']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    image: lagermanager-frontend:local
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8082}:8080"
    networks:
      - application
      - ingress
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:

networks:
  application:
    internal: true
  # Only the web server joins this bridge to publish its loopback HTTP port.
  ingress:
