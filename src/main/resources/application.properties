spring.application.name=lagermanager

spring.datasource.url=${LAGERMANAGER_DB_URL:}
spring.datasource.username=${LAGERMANAGER_DB_USER:}
spring.datasource.password=${LAGERMANAGER_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Explicit one-time local actions; normal startup never populates or resets.
lagermanager.demo.populate=${LAGERMANAGER_LOCAL_DEMO_POPULATE:false}
lagermanager.demo.reset-passwords=${LAGERMANAGER_DEMO_RESET_PASSWORDS:false}

# Read-only periodic stock summary; no scheduler/job is registered unless explicitly enabled.
lagermanager.low-stock.enabled=${LAGERMANAGER_LOW_STOCK_ENABLED:false}
lagermanager.low-stock.interval=${LAGERMANAGER_LOW_STOCK_INTERVAL:PT2H}
lagermanager.low-stock.threshold=${LAGERMANAGER_LOW_STOCK_THRESHOLD:10}
